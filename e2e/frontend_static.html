<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Guest Assistant</title>
  <style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 16px;
  line-height: 1.55;
  color: #1c1c1e;
  background: #e8e4de;
  -webkit-font-smoothing: antialiased;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0);
  white-space: nowrap; border: 0;
}

.chat-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 800px;
  margin: 0 auto;
  background: #ffffff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.1);
}

.chat-header {
  background: #1b2a3b;
  color: #fff;
  flex-shrink: 0;
  padding: 0 1.375rem;
}

.chat-header-inner {
  display: flex;
  align-items: center;
  gap: 0.875rem;
  padding: 1rem 0;
}

.chat-header-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  flex-shrink: 0;
  color: #c9a96e;
}

.chat-header-text { flex: 1; min-width: 0; }

.chat-header-title {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 600;
  font-family: 'Georgia', serif;
  letter-spacing: 0.01em;
}

.chat-header-subtitle {
  margin: 0.1rem 0 0;
  font-size: 0.8125rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: rgba(255,255,255,.6);
  font-style: italic;
}

.chat-header-status {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  flex-shrink: 0;
}

.status-dot {
  width: 8px; height: 8px;
  background: #4caf82;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(76,175,130,.25);
}

.status-label {
  font-size: 0.75rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: rgba(255,255,255,.55);
  letter-spacing: 0.04em;
}

.message-list {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1.5rem 1.375rem 0.5rem;
  scroll-behavior: smooth;
}

.message-list-inner {
  display: flex;
  flex-direction: column;
  gap: 1.125rem;
  min-height: 100%;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 100%;
  padding: 3rem 1.5rem;
}

.empty-state-icon {
  color: #c9a96e;
  margin-bottom: 1.25rem;
  opacity: 0.9;
}

.empty-state-title {
  margin: 0 0 0.5rem;
  font-size: 1.375rem;
  font-weight: 600;
  font-family: 'Georgia', serif;
  color: #1b2a3b;
  letter-spacing: 0.01em;
}

.empty-state-body {
  margin: 0 0 1.75rem;
  font-size: 0.9375rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #6b7280;
  max-width: 340px;
  line-height: 1.65;
}

.suggestion-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  max-width: 440px;
}

.suggestion-chip {
  padding: 0.5rem 1rem;
  border: 1.5px solid #d6cfc5;
  border-radius: 20px;
  background: #faf9f7;
  color: #1b2a3b;
  font-size: 0.8125rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
  line-height: 1.3;
}

.suggestion-chip:hover {
  border-color: #c9a96e;
  background: #fffbf4;
  color: #8a6830;
}

.message-row {
  display: flex;
  align-items: flex-start;
  gap: 0.625rem;
  max-width: 100%;
}

.message-row--user { flex-direction: row-reverse; }
.message-row--assistant { flex-direction: row; }

.message-bubble-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: min(560px, 82%);
  min-width: 0;
}

.message-row--user .message-bubble-wrap { align-items: flex-end; }

.message-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.625rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 700;
  letter-spacing: 0.02em;
  background: #1b2a3b;
  color: #c9a96e;
  margin-top: 2px;
}

.message-avatar--user {
  background: #e8e3dc;
  color: #5c5347;
}

.message-bubble {
  padding: 0.7rem 0.95rem 0.5rem;
  border-radius: 14px;
  word-break: break-word;
  width: 100%;
}

.message-bubble--assistant {
  background: #f4f1eb;
  border-radius: 4px 14px 14px 14px;
}

.message-bubble--user {
  background: #1b2a3b;
  color: #fff;
  border-radius: 14px 4px 14px 14px;
}

.message-bubble--error {
  background: #fff4f4;
  border: 1.5px solid #fca5a5;
  border-radius: 4px 14px 14px 14px;
  color: #7f1d1d;
}

.message-text {
  margin: 0 0 0.3rem;
  font-size: 0.9375rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  white-space: pre-line;
}

.message-bubble--user .message-text { color: #fff; }

.message-time {
  display: block;
  font-size: 0.6875rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #aaa49c;
  text-align: right;
}

.message-bubble--user .message-time { color: rgba(255,255,255,.4); }
.message-bubble--error .message-time { color: #f87171; }

.avail-card {
  background: #faf9f7;
  border: 1.5px solid #e2ddd6;
  border-radius: 12px;
  padding: 1rem 1.0625rem;
  width: 100%;
}

.avail-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  margin-bottom: 0.875rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid #e2ddd6;
}

.avail-meta-item {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.8125rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #4b5563;
}

.avail-rooms {
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.avail-room {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.625rem 0.75rem;
  background: #fff;
  border: 1px solid #e9e5de;
  border-radius: 8px;
}

.avail-room-name {
  font-size: 0.9375rem;
  font-family: 'Georgia', serif;
  font-weight: 600;
  color: #1b2a3b;
}

.avail-room-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
}

.avail-pill {
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 0.55rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0ede8;
  color: #4b5563;
}

.avail-pill--accent {
  background: #ecf5ee;
  color: #166534;
}

.avail-none {
  margin: 0;
  font-size: 0.9rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #6b7280;
  line-height: 1.5;
}

.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0.375rem 1.375rem 0.25rem;
  height: 30px;
  flex-shrink: 0;
}

.typing-indicator span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #c9a96e;
  animation: bounce 1.1s infinite ease-in-out;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40% { transform: translateY(-5px); opacity: 1; }
}

.chat-input-bar {
  flex-shrink: 0;
  border-top: 1px solid #ece8e1;
  background: #fff;
  padding: 0.75rem 1.375rem;
}

.chat-input-inner {
  display: flex;
  align-items: flex-end;
  gap: 0.625rem;
  background: #f7f4f0;
  border: 1.5px solid #ddd8cf;
  border-radius: 14px;
  padding: 0.5rem 0.5rem 0.5rem 0.9rem;
  transition: border-color 0.15s;
}

.chat-input-inner:focus-within {
  border-color: #1b2a3b;
  background: #faf9f7;
}

.chat-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 0.9375rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #1c1c1e;
  line-height: 1.5;
  resize: none;
  outline: none;
  max-height: 120px;
  overflow-y: auto;
  min-height: 24px;
}

.chat-input::placeholder { color: #b5afa6; }

.chat-send-btn {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border: none;
  border-radius: 10px;
  background: #1b2a3b;
  color: #c9a96e;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, opacity 0.15s;
}

.chat-send-btn:hover:not(:disabled) { background: #263f58; }
.chat-send-btn:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ── State ────────────────────────────────────────────────────────────
    let messages = [];
    let loading = false;
    let context = null;
    let nextId = 1;

    const API_URL = '/api/assistant';
    const ERROR_CONNECTION = 'Unable to reach the assistant. Please check your connection and try again.';
    const ERROR_SERVER = (s) => `Something went wrong on our end (${s}). Please try again shortly.`;
    const ERROR_PARSE = 'Received an unexpected response. Please try again.';

    // ── API ───────────────────────────────────────────────────────────────
    async function sendMessage(message, ctx) {
      const body = { message, context: ctx ?? {} };
      let response;
      try {
        response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch {
        throw new Error(ERROR_CONNECTION);
      }
      if (!response.ok) throw new Error(ERROR_SERVER(response.status));
      let data;
      try { data = await response.json(); } catch { throw new Error(ERROR_PARSE); }
      if (!data?.message) throw new Error(ERROR_PARSE);
      return {
        message: data.message,
        type: data.type ?? 'text',
        data: data.data ?? null,
        context: data.context ?? null,
      };
    }

    // ── Render ────────────────────────────────────────────────────────────
    function makeTimeStr(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderAvailCard(data) {
      if (!data) return '';
      const { check_in, check_out, adults, available, rooms = [] } = data;
      let roomsHtml = '';
      if (available && rooms.length > 0) {
        roomsHtml = '<div class="avail-rooms">' + rooms.map(r => `
          <div class="avail-room">
            <div class="avail-room-name">${escHtml(r.room_type)}</div>
            <div class="avail-room-meta">
              <span class="avail-pill">Up to ${r.max_adults} guest${r.max_adults !== 1 ? 's' : ''}</span>
              <span class="avail-pill avail-pill--accent">${r.available_rooms} room${r.available_rooms !== 1 ? 's' : ''} available</span>
            </div>
          </div>`).join('') + '</div>';
      } else {
        roomsHtml = '<p class="avail-none">No rooms match your search. Try different dates or contact us directly.</p>';
      }
      return `<div class="avail-card">
        <div class="avail-meta-row">
          <span class="avail-meta-item">${escHtml(check_in)} — ${escHtml(check_out)}</span>
          <span class="avail-meta-item">${adults} adult${adults !== 1 ? 's' : ''}</span>
        </div>
        ${roomsHtml}
      </div>`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMessage(msg) {
      const isUser = msg.role === 'user';
      const isError = msg.msgType === 'error';
      const showCard = !isUser && msg.msgType === 'availability_result' && msg.msgData;
      const bubbleClass = [
        'message-bubble',
        isUser ? 'message-bubble--user' : 'message-bubble--assistant',
        isError ? 'message-bubble--error' : '',
      ].filter(Boolean).join(' ');

      const avatarLeft = !isUser ? `<div class="message-avatar" aria-hidden="true">A</div>` : '';
      const avatarRight = isUser ? `<div class="message-avatar message-avatar--user" aria-hidden="true">You</div>` : '';

      return `<div class="message-row message-row--${isUser ? 'user' : 'assistant'}">
        ${avatarLeft}
        <div class="message-bubble-wrap">
          <div class="${bubbleClass}">
            <p class="message-text">${escHtml(msg.content)}</p>
            <time class="message-time" datetime="${msg.timestamp}">${makeTimeStr(msg.timestamp)}</time>
          </div>
          ${showCard ? renderAvailCard(msg.msgData) : ''}
        </div>
        ${avatarRight}
      </div>`;
    }

    function renderEmptyState() {
      const suggestions = [
        'What time is check-in?',
        'Do you have parking?',
        'Is breakfast included?',
        'I need a room for 2 adults.',
      ];
      return `<div class="empty-state">
        <div class="empty-state-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <h2 class="empty-state-title">Azure Bay Hotel</h2>
        <p class="empty-state-body">How can I help with your stay? Ask about check-in times, amenities, or room availability.</p>
        <div class="suggestion-chips">
          ${suggestions.map(s => `<button class="suggestion-chip" data-suggestion="${escHtml(s)}">${escHtml(s)}</button>`).join('')}
        </div>
      </div>`;
    }

    function render() {
      const app = document.getElementById('app');
      const typingHtml = loading
        ? `<div class="typing-indicator" aria-live="polite" aria-label="Assistant is typing"><span></span><span></span><span></span></div>`
        : '';

      const msgHtml = messages.length === 0
        ? renderEmptyState()
        : messages.map(renderMessage).join('');

      app.innerHTML = `
        <div class="chat-shell">
          <header class="chat-header">
            <div class="chat-header-inner">
              <div class="chat-header-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                  <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
              </div>
              <div class="chat-header-text">
                <h1 class="chat-header-title">Guest Services</h1>
                <p class="chat-header-subtitle">Azure Bay Hotel</p>
              </div>
              <div class="chat-header-status">
                <div class="status-dot"></div>
                <span class="status-label">Online</span>
              </div>
            </div>
          </header>

          <main class="message-list" id="message-list" role="log" aria-label="Conversation" aria-live="polite">
            <div class="message-list-inner">
              ${msgHtml}
            </div>
          </main>

          ${typingHtml}

          <footer class="chat-input-bar">
            <div class="chat-input-inner">
              <label for="chat-input" class="sr-only">Type your message</label>
              <textarea
                id="chat-input"
                class="chat-input"
                rows="1"
                placeholder="Ask about your stay…"
                ${loading ? 'disabled' : ''}
                autocomplete="off"
              ></textarea>
              <button
                class="chat-send-btn"
                id="send-btn"
                ${loading ? 'disabled' : ''}
                aria-label="Send message"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </footer>
        </div>
      `;

      // Rebind events after each render
      bindEvents();

      // Scroll to bottom
      const ml = document.getElementById('message-list');
      if (ml) ml.scrollTop = ml.scrollHeight;
    }

    function bindEvents() {
      const textarea = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');

      if (textarea) {
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSubmit();
          }
        });
        // Update send button disabled state based on textarea content
        textarea.addEventListener('input', () => {
          if (sendBtn) sendBtn.disabled = loading || !textarea.value.trim();
        });
      }

      if (sendBtn) {
        // Initially disable if empty
        sendBtn.disabled = loading || !(textarea && textarea.value.trim());
        sendBtn.addEventListener('click', handleSubmit);
      }

      // Suggestion chips
      document.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const text = chip.dataset.suggestion;
          if (text) handleSend(text);
        });
      });
    }

    async function handleSubmit() {
      const textarea = document.getElementById('chat-input');
      if (!textarea) return;
      const trimmed = textarea.value.trim();
      if (!trimmed) return;
      await handleSend(trimmed);
    }

    async function handleSend(text) {
      const userMsg = {
        id: nextId++,
        role: 'user',
        content: text,
        timestamp: new Date().toISOString(),
        msgType: 'text',
        msgData: null,
      };
      messages = [...messages, userMsg];
      loading = true;
      render();

      try {
        const result = await sendMessage(text, context);
        if (result.context) context = result.context;
        const assistantMsg = {
          id: nextId++,
          role: 'assistant',
          content: result.message,
          timestamp: new Date().toISOString(),
          msgType: result.type,
          msgData: result.data,
        };
        messages = [...messages, assistantMsg];
      } catch (err) {
        const safe = err?.message?.length < 300
          ? err.message
          : "Sorry, I'm having trouble connecting right now. Please try again.";
        messages = [...messages, {
          id: nextId++,
          role: 'assistant',
          content: safe,
          timestamp: new Date().toISOString(),
          msgType: 'error',
          msgData: null,
        }];
      } finally {
        loading = false;
        render();
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
